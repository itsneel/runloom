name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-24.04
    # Serialize deployments to this repository’s Pages site.
    concurrency:
      group: runloom-helm-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Build the commit selected by the manual run.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install website dependencies and test
        working-directory: Website
        run: npm ci && npm test
      - name: Check downloadable installer
        run: |
          bash -n scripts/install-version.sh
          python3 scripts/tests/install-version.py
      - name: Build the public website
        working-directory: Website
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH%/}/"
      - name: Assemble website
        run: |
          mkdir -p dist/pages
          cp -R Website/dist/runloom-website/browser/. dist/pages/
          cp Website/dist/runloom-website/3rdpartylicenses.txt dist/pages/
          cp scripts/install-version.sh dist/pages/install.sh
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/pages
          name: runloom-pages-${{ github.run_attempt }}
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: runloom-pages-${{ github.run_attempt }}
      - name: Verify the public website
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${PAGE_URL%/}/" -o dist/live-index.html &&
              cmp -s dist/pages/index.html dist/live-index.html &&
              curl --fail --silent --show-error "${PAGE_URL%/}/install.sh" -o dist/live-install.sh &&
              cmp -s dist/pages/install.sh dist/live-install.sh; then break; fi
            if [[ $attempt == 12 ]]; then exit 1; fi
            sleep 10
          done
          echo "Website: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
