    "/conversations/{id}/jobs/{job}/apply": {
      "parameters": [
        {
          "$ref": "#/components/parameters/org"
        },
        {
          "$ref": "#/components/parameters/team"
        },
        {
          "$ref": "#/components/parameters/workflow"
        },
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        },
        {
          "name": "job",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "post": {
        "summary": "Approve and apply the exact persisted child proposal",
        "description": "Editor/admin permission is rechecked by the workflow owner using the current human bearer. General chat, incomplete jobs, changed proposal hashes, stale graph revisions and locked drafts cannot apply. Reuse the same job ID and hash after an uncertain response; the owner stores an atomic idempotency receipt. No credentials are persisted. Creates one child draft and one root attachment only.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "approved",
                  "proposal_hash"
                ],
                "properties": {
                  "approved": {
                    "type": "boolean",
                    "enum": [
                      true
                    ]
                  },
                  "proposal_hash": {
                    "type": "string",
                    "minLength": 64,
                    "maxLength": 64
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Conversation with a confirmed draft-only apply receipt",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "400": {
            "description": "Explicit approval and workflow scope required"
          },
          "401": {
            "description": "Unauthenticated"
          },
          "403": {
            "description": "No authoring permission"
          },
          "404": {
            "description": "Conversation outside caller scope"
          },
          "409": {
            "description": "Proposal mismatch or stale graph; generate and review a fresh proposal"
          },
          "422": {
            "description": "Invalid proposed nodes or graph"
          },
          "423": {
            "description": "Finish editing the root or its draft children"
          },
          "503": {
            "description": "Owner or storage unavailable; retry identical approval safely"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "studioBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "parameters": {
      "org": {
        "name": "org_id",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "team": {
        "name": "team_id",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "id": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "job": {
        "name": "job",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "workflow": {
        "name": "workflow_id",
        "in": "query",
        "required": false,
        "description": "Saved workflow definition ID, not a run ID. Publishing is not required. Omit for general chat; include the same ID on every request for a scoped conversation.",
        "schema": {
          "type": "string",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"
        }
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "detail": {
            "type": "string"
          }
        }
      },
      "Message": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string"
          },
          "job_id": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Job": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "send",
              "queue",
              "stop_and_send"
            ]
          },
          "kind": {
            "type": "string",
            "enum": [
              "planning",
              "authoring"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "completed",
              "failed",
              "cancelled",
              "interrupted"
            ]
          },
          "error": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          },
          "deadline": {
            "type": "string",
            "format": "date-time"
          },
          "authoring_context": {
            "type": "object",
            "description": "Saved structural context only; no node payloads, bearer tokens or credentials.",
            "properties": {
              "root_id": {
                "type": "string"
              },
              "revision": {
                "type": "string"
              },
              "project_id": {
                "type": "string"
              },
              "workflows": {
                "type": "array",
                "items": {
                  "type": "object"
                }
              }
            }
          },
          "proposal": {
            "type": "object",
            "properties": {
              "name": {
                "type": "string"
              },
              "before_step_id": {
                "type": "string"
              },
              "steps": {
                "type": "array",
                "items": {
                  "type": "object"
                }
              }
            }
          },
          "proposal_hash": {
            "type": "string"
          },
          "applied": {
            "type": "object",
            "properties": {
              "request_id": {
                "type": "string",
                "format": "uuid"
              },
              "parent_id": {
                "type": "string"
              },
              "child_id": {
                "type": "string"
              },
              "draft_only": {
                "type": "boolean",
                "enum": [
                  true
                ]
              }
            }
          }
        }
      },
      "Conversation": {
        "type": "object",
        "properties": {
          "id": {
