{
  "openapi": "3.0.3",
  "info": {
    "title": "Runloom Assistant Studio API",
    "version": "1.0.0",
    "description": "Private chat and explicitly reviewed child-draft authoring. Human Studio identity and live team access required. Immutable workflow_id scopes proposals to the current root and its reachable children. Existing children are read-only. No publishing, execution or schedule tools. General chat remains planning-only."
  },
  "servers": [
    {
      "url": "/api/v1/studio/assistant"
    }
  ],
  "security": [
    {
      "studioBearer": []
    }
  ],
  "paths": {
