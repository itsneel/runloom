    "/conversations/{id}/messages": {
      "parameters": [
        {
          "$ref": "#/components/parameters/org"
        },
        {
          "$ref": "#/components/parameters/team"
        },
        {
          "$ref": "#/components/parameters/id"
        },
        {
          "$ref": "#/components/parameters/workflow"
        }
      ],
      "post": {
        "summary": "Persist a message and enqueue a planning job atomically",
        "description": "Same request_id, text and mode returns existing state; changed text or mode conflicts. Default send rejects an active response. queue durably appends a turn; stop_and_send atomically cancels the current active turn and gives the new turn priority, preserving other queued turns. Retrying stop_and_send cannot cancel a newer response. At most one running generation per conversation, up to 10 waiting turns, 40 total turns, and 8000 UTF-8 bytes per user message. Provider execution is not retried automatically; delivery can be retried with the same request_id. With no configured provider, saves the user message and reply 'LLM is not configured.' with a completed job and empty model; no model is called.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "request_id",
                  "content"
                ],
                "properties": {
                  "request_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "content": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8000
                  },
                  "mode": {
                    "type": "string",
                    "enum": [
                      "send",
                      "queue",
                      "stop_and_send"
                    ],
                    "default": "send"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Already accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "202": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Conversation"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Invalid or expired human Studio token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Team access denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Conversation not found or not owned",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Conflict, active job or conversation limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Storage or access service unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/conversations/{id}/events": {
