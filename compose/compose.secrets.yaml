# Opt-in workflow credential encryption. Use the same persistent key on API and worker.
# RUNLOOM_SECRETS_KEY_PATH is a host-side file path, not a key value.
# A secret-manager agent can supply this raw 32-byte file. Compose mounts it read-only.
# File-backed Compose secrets retain host permissions: UID 65532 must be able to read it.
services:
  api:
    group_add:
      - "${RUNLOOM_SECRETS_KEY_GID:-65532}"
    configs:
      - {source: runloom-vault, target: /etc/runloom/config.d/20-vault.yaml}
    secrets:
      - workflow-key
  worker:
    group_add:
      - "${RUNLOOM_SECRETS_KEY_GID:-65532}"
    configs:
      - {source: runloom-vault, target: /etc/runloom/config.d/20-vault.yaml}
    secrets:
      - workflow-key
configs:
  runloom-vault:
    file: ${RUNLOOM_VAULT_CONFIG_PATH:-./compose/config/vault.yaml}
secrets:
  workflow-key:
    file: ${RUNLOOM_SECRETS_KEY_PATH:?Set the path to the persistent 32-byte workflow encryption key file}
