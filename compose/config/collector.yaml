receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 16
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 100
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 1m
  file:
    path: /var/log/telemetry/events.json
    rotation:
      max_megabytes: 10
      max_backups: 3
      max_days: 7
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
