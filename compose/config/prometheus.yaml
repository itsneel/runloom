global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: runloom
    static_configs:
      - targets: [api:8889]
        labels: {component: api}
      - targets: [auth:8889]
        labels: {component: auth}
      - targets: [workflows:8889]
        labels: {component: workflows}
      - targets: [management:8889]
        labels: {component: management}
      - targets: [worker:8889]
        labels: {component: worker}
      - targets: [assistant:8889]
        labels: {component: assistant}
