<section class="notice-card" (mouseenter)="hover(true)" (mouseleave)="hover(false)" (focusin)="focus(true)" (focusout)="focus(false, $event)">
  <span class="notice-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      @if (tone === 'success') { <path d="m6 12 4 4 8-8" /> }
      @else if (tone === 'error') { <path d="m8 8 8 8M16 8l-8 8" /><circle cx="12" cy="12" r="9" /> }
      @else if (tone === 'warning') { <path d="m12 3 10 18H2L12 3Z M12 9v4m0 4h.01" /> }
      @else { <circle cx="12" cy="12" r="9" /><path d="M12 11v6m0-10h.01" /> }
    </svg>
  </span>
  <div class="notice-copy" [attr.role]="tone === 'error' ? 'alert' : 'status'" aria-atomic="true">
    <strong>{{ heading }}</strong>
    <p>{{ message }}</p>
  </div>
  @if (dismissible) {
    <button class="notice-close" type="button" [attr.aria-label]="dismissLabel" (click)="close()">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17" /></svg>
    </button>
  }
</section>
