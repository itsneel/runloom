<button #trigger type="button" class="trigger" [class.compact]="compact" popovertarget="appearance-options"
      [attr.aria-label]="'Appearance: ' + theme.preference()" (click)="position(trigger)">
      <runloom-icon [name]="theme.resolved() === 'dark' ? 'moon' : 'sun'" />
      @if (!compact) { <span>Appearance</span><small>{{ theme.preference() }}</small> }
    </button>
    <div #panel id="appearance-options" popover="auto" [style.left.px]="left" [style.bottom.px]="bottom">
      <strong>Appearance</strong>
      <div role="group" aria-label="Color theme">
        @for (option of options; track option.value) {
          <button type="button" [attr.aria-pressed]="theme.preference() === option.value"
            (click)="choose(option.value)">
            <runloom-icon [name]="option.icon" /><span>{{ option.label }}</span>
            @if (theme.preference() === option.value) { <span aria-hidden="true">✓</span> }
          </button>
        }
      </div>
      <p>System follows your device.</p>
    </div>
