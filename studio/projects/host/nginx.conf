server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Docker's embedded DNS must be re-resolved after dependency recreation.
  # Helm supplies its own proxy configuration for Kubernetes service DNS.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $runloom_api api:8080;
  set $runloom_identity keycloak:8080;
  set $runloom_workflows workflows-ui:8080;
  set $runloom_management management-ui:8080;
  set $runloom_platform platform-ui:8080;
  location = /documentation.json { add_header Cache-Control "no-store"; }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_buffering off;
    proxy_pass http://$runloom_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://$runloom_identity;
    # Preserve Keycloak's own framing/CSP policy for its session-check iframes.
    # Local directives prevent inheriting the Studio-wide frame denial.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Missing executable assets must return 404, never the host's HTML fallback.
  location /remotes/workflows/ {
    rewrite ^/remotes/workflows/(.*)$ /$1 break;
    proxy_pass http://$runloom_workflows;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }
  location /remotes/management/ {
    rewrite ^/remotes/management/(.*)$ /$1 break;
    proxy_pass http://$runloom_management;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }
  location /remotes/ { return 404; }
  location /remotes/platform/ {
    rewrite ^/remotes/platform/(.*)$ /$1 break;
    proxy_pass http://$runloom_platform;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }
  location = /federation.manifest.json {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
}
