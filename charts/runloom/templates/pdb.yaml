{{- range $component, $settings := .Values.podDisruptionBudgets.workloads }}
{{- if $settings.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "runloom.fullname" $ }}-{{ $component }}
  labels:
    {{- include "runloom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: {{ $settings.maxUnavailable | toJson }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
