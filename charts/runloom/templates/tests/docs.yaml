{{- if .Values.docs.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "runloom.fullname" . }}-test-docs
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: documentation
      image: {{ printf "%s:%s" .Values.images.gateway.repository .Values.images.gateway.tag | quote }}
      imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
      command: ["/runloom-gateway"]
      args: ["healthcheck", "http://{{ include "runloom.fullname" . }}-docs/healthz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
{{- end }}
