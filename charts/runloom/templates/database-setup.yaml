{{- if .Values.databaseSetup.enabled }}
{{- $secret := required "databaseSetup.existingSecret is required before install/upgrade" .Values.databaseSetup.existingSecret }}
{{- range $owner := list "auth" "workflows" "management" }}
{{- if ne (index $.Values.splitServices.databases $owner).name (printf "runloom_%s" $owner) }}
{{- fail "databaseSetup requires the database names runloom_auth, runloom_workflows and runloom_management" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runloom.fullname" . }}-database-setup-config
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  database-setup.json: {{ dict "driver" .Values.database.driver "adminURLFile" "/run/secrets/database-admin-url" "directory" "/run/secrets" "assistant" .Values.assistant.enabled | toJson | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "runloom.fullname" . }}-database-setup
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: setup
          image: {{ printf "%s:%s" (index .Values.images "database-setup").repository (index .Values.images "database-setup").tag | quote }}
          imagePullPolicy: {{ (index .Values.images "database-setup").pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets, readOnly: true}
            - {name: configuration, mountPath: /etc/runloom, readOnly: true}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "runloom.fullname" . }}-database-setup-config
        - name: credentials
          projected:
            defaultMode: 0440
            sources:
              {{- if .Values.assistant.enabled }}
              - secret:
                  name: {{ .Values.assistant.databaseSecret | quote }}
                  items:
                    - {key: {{ .Values.assistant.databaseURLKey | quote }}, path: assistant-database-url}
                    - {key: {{ .Values.assistant.databasePasswordKey | quote }}, path: assistant-database-password}
              {{- end }}
              - secret:
                  name: {{ $secret | quote }}
                  items:
                    - {key: database-admin-url, path: database-admin-url}
                    {{- range $owner := list "auth" "workflows" "management" }}
                    - {key: {{ $owner }}-database-password, path: {{ $owner }}-database-password}
                    {{- end }}
              {{- range $owner := list "auth" "workflows" "management" }}
              - secret:
                  name: {{ (index $.Values.splitServices.databases $owner).existingSecret | quote }}
                  items:
                    - {key: {{ (index $.Values.splitServices.databases $owner).secretKey | quote }}, path: {{ $owner }}-database-url}
              {{- end }}
{{- end }}
