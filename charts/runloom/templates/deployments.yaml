{{- $components := list "api" "worker" "ui" "workflows-ui" "management-ui" "platform-ui" "auth" "workflows" "management" }}
{{- range $component := $components }}
{{- $isUI := has $component (list "ui" "workflows-ui" "management-ui" "platform-ui") }}
{{- $settings := index $.Values $component }}
{{- if has $component (list "auth" "workflows" "management") }}{{- $settings = mergeOverwrite (deepCopy $.Values.splitServices.resources) (index $.Values.splitServices $component) }}{{- end }}
{{- $gateway := eq $component "api" }}
{{- $owner := $component }}{{- if eq $component "worker" }}{{- $owner = "workflows" }}{{- end }}
{{- $vault := and (has $component (list "workflows" "worker")) (include "runloom.workflowSecret" $) }}
{{- $provisioner := and $.Values.consumer.provisioning.enabled (eq $component "auth") }}
{{- $image := $.Values.images.workflows }}
{{- if eq $component "worker" }}{{- $image = $.Values.images.worker }}{{- end }}
{{- if eq $component "api" }}{{- $image = $.Values.images.gateway }}{{- end }}
{{- if has $component (list "auth" "management") }}{{- $image = index $.Values.images $component }}{{- end }}
{{- if $isUI }}{{- $image = index $.Values.images $component }}{{- end }}
{{- $port := 8080 }}
{{- if eq $component "worker" }}{{- $port = 8081 }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runloom.fullname" $ }}-{{ $component }}
  labels:
    {{- include "runloom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if not (index $.Values.autoscaling.workloads $component).enabled }}
  replicas: {{ $settings.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "runloom.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if eq $component "ui" }}
        checksum/documentation: {{ $.Values.docs.publicURL | sha256sum }}
        {{- end }}
        {{- if and $.Values.observability.enabled (not $isUI) }}
        checksum/observability: {{ include (print $.Template.BasePath "/observability.yaml") $ | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "runloom.serviceAccount" (dict "root" $ "component" $component) }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if $isUI }}101{{ else }}65532{{ end }}
        runAsGroup: {{ if $isUI }}101{{ else }}65532{{ end }}
        fsGroup: {{ if $isUI }}101{{ else }}65532{{ end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $image.repository $image.tag | quote }}
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- if not $isUI }}
          command: [{{ if $gateway }}"/runloom-gateway"{{ else }}{{ printf "/runloom-%s" $component | quote }}{{ end }}]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if not $isUI }}
          env:
            - name: RUNLOOM_CONFIG_FILE
              value: /etc/runloom/config.yaml
          {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ if $isUI }}/healthz{{ else if $vault }}/readyz/vault{{ else }}/readyz{{ end }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            {{- if not $isUI }}
            - {name: configuration, mountPath: /etc/runloom, readOnly: true}
            {{- if not $gateway }}
            - {name: database, mountPath: /var/run/runloom-database, readOnly: true}
            - {name: service-token, mountPath: /var/run/runloom-service, readOnly: true}
            - {name: service-trust, mountPath: /var/run/runloom-trust, readOnly: true}
            {{- end }}
            {{- end }}
            {{- if and (eq $component "worker") $.Values.llm.pricingConfigMap }}
            - {name: pricing, mountPath: /var/run/runloom-pricing, readOnly: true}
            {{- end }}
            {{- if and (eq $component "worker") $.Values.email.enabled $.Values.email.username }}
            - {name: smtp, mountPath: /var/run/runloom-smtp, readOnly: true}
            {{- end }}
            {{- if $vault }}
            {{- if and $.Values.temporal.tls.enabled $.Values.temporal.tls.existingSecret }}
            - {name: temporal-tls, mountPath: /var/run/runloom-temporal-tls, readOnly: true}
            {{- end }}
            {{- if $.Values.executionSecurity.existingKeyringSecret }}
            - {name: payload-keyring, mountPath: /var/run/runloom-payload-keys, readOnly: true}
            {{- end }}
            - name: workflow-secrets
              mountPath: /var/run/runloom-workflow-secrets
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if $provisioner }}
            - name: provisioner
              mountPath: /var/run/runloom-provisioner
              readOnly: true
            {{- end }}
            {{- if eq $component "ui" }}
            - name: documentation
              mountPath: /usr/share/nginx/html/documentation.json
              subPath: documentation.json
              readOnly: true
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- end }}
            {{- if and (eq $component "worker") $.Values.llm.existingSecret }}
            - name: llm
              mountPath: /var/run/runloom-llm
              readOnly: true
            {{- end }}
        {{- if and $.Values.observability.enabled (not $isUI) }}
        - name: telemetry
          image: {{ $.Values.observability.collectorImage | quote }}
          args: ["--config=/etc/otel/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: metrics, containerPort: 8889}
          livenessProbe:
            httpGet: {path: /, port: 13133}
            initialDelaySeconds: 10
          resources:
            {{- toYaml $.Values.observability.collectorResources | nindent 12 }}
          volumeMounts:
            - {name: telemetry-config, mountPath: /etc/otel, readOnly: true}
            - {name: telemetry-logs, mountPath: /var/log/telemetry}
        {{- end }}
      volumes:
        {{- if and $.Values.observability.enabled (not $isUI) }}
        - name: telemetry-config
          configMap:
            name: {{ default (printf "%s-collector" (include "runloom.fullname" $)) $.Values.observability.collectorConfigMap }}
        - name: telemetry-logs
          emptyDir: {sizeLimit: 64Mi}
        {{- end }}
        {{- if and $vault $.Values.temporal.tls.enabled $.Values.temporal.tls.existingSecret }}
        - name: temporal-tls
          secret:
            secretName: {{ $.Values.temporal.tls.existingSecret }}
            defaultMode: 0440
            items:
              {{- if $.Values.temporal.tls.caKey }}
              - {key: {{ $.Values.temporal.tls.caKey | quote }}, path: ca.crt}
              {{- end }}
              {{- if $.Values.temporal.tls.certKey }}
              - {key: {{ $.Values.temporal.tls.certKey | quote }}, path: tls.crt}
              - {key: {{ required "temporal.tls.keyKey is required with certKey" $.Values.temporal.tls.keyKey | quote }}, path: tls.key}
              {{- end }}
        {{- end }}
        {{- if and $vault $.Values.executionSecurity.existingKeyringSecret }}
        - name: payload-keyring
          secret:
            secretName: {{ $.Values.executionSecurity.existingKeyringSecret }}
            defaultMode: 0440
            items: [{key: {{ $.Values.executionSecurity.keyringSecretKey | quote }}, path: keyring.json}]
        {{- end }}
        {{- if not $isUI }}
        - name: configuration
          configMap:
            name: {{ include "runloom.fullname" $ }}-config
            items: [{key: {{ printf "%s.yaml" $component | quote }}, path: config.yaml}]
        {{- if not $gateway }}
        - name: database
          secret:
            secretName: {{ required (printf "splitServices.databases.%s.existingSecret is required" $owner) (index $.Values.splitServices.databases $owner).existingSecret }}
            defaultMode: 0440
            items: [{key: {{ (index $.Values.splitServices.databases $owner).secretKey | quote }}, path: url}]
        - name: service-token
          secret:
            secretName: {{ required (printf "splitServices.credentials.%s is required" $component) (index $.Values.splitServices.credentials $component) }}
            defaultMode: 0440
            items: [{key: token, path: token}]
        - name: service-trust
          configMap:
            name: {{ required "splitServices.trustConfigMap is required" $.Values.splitServices.trustConfigMap }}
            items: [{key: trust.json, path: trust.json}]
        {{- end }}
        {{- end }}
        {{- if and (eq $component "worker") $.Values.llm.pricingConfigMap }}
        - name: pricing
          configMap:
            name: {{ $.Values.llm.pricingConfigMap }}
            items: [{key: {{ $.Values.llm.pricingKey }}, path: pricing.json}]
        {{- end }}
        {{- if and (eq $component "worker") $.Values.email.enabled $.Values.email.username }}
        - name: smtp
          secret:
            secretName: {{ $.Values.email.existingSecret }}
            defaultMode: 0440
            items: [{key: {{ $.Values.email.secretKey }}, path: password}]
        {{- end }}
        {{- if $vault }}
        - name: workflow-secrets
          secret:
            secretName: {{ include "runloom.workflowSecret" $ }}
            defaultMode: 0440
            items:
              - key: {{ $.Values.workflowSecrets.secretKey }}
                path: encryption-key
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $provisioner }}
        - name: provisioner
          secret:
            secretName: {{ required "consumer.provisioning.existingSecret is required" $.Values.consumer.provisioning.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ $.Values.consumer.provisioning.secretKey }}
                path: client-secret
        {{- end }}
        {{- if eq $component "ui" }}
        - name: documentation
          configMap:
            name: {{ include "runloom.fullname" $ }}-documentation
        - name: nginx
          configMap:
            name: {{ include "runloom.fullname" $ }}-nginx
        {{- end }}
        {{- if and (eq $component "worker") $.Values.llm.existingSecret }}
        - name: llm
          secret:
            secretName: {{ $.Values.llm.existingSecret }}
            items:
              - key: {{ $.Values.llm.secretKey }}
                path: api-key
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey | quote }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
        {{- end }}
      {{- end }}
{{- end }}
