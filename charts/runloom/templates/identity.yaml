{{- if .Values.development.enabled }}
{{- if or (ne .Values.auth.realm "runloom") (ne .Values.auth.clientID "runloom") }}
{{- fail "development identity uses realm/clientID runloom; use external identity for custom settings" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runloom.fullname" . }}-realm
data:
  runloom-realm.json: |
    {{- .Files.Get "files/runloom-realm.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runloom.fullname" . }}-login-theme
data:
  {{- range $path, $_ := .Files.Glob "files/keycloak-theme/runloom/login/**" }}
  {{- if not (hasSuffix ".ico" $path) }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
binaryData:
  {{- range $path, $_ := .Files.Glob "files/keycloak-theme/runloom/login/**" }}
  {{- if hasSuffix ".ico" $path }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- range $component := list "keycloak" "mailpit" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "runloom.fullname" $ }}-{{ $component }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    {{- if eq $component "keycloak" }}
    - {name: http, port: 8080, targetPort: http}
    {{- else }}
    - {name: http, port: 8025, targetPort: http}
    - {name: smtp, port: 1025, targetPort: smtp}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runloom.fullname" $ }}-{{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/identity: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/realm: {{ $.Files.Get "files/runloom-realm.json" | sha256sum }}
        checksum/login-theme: {{ ($.Files.Glob "files/keycloak-theme/runloom/login/**").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ $component }}
          {{- if eq $component "keycloak" }}
          image: {{ $.Values.development.keycloakImage | quote }}
          args: [start-dev, --import-realm]
          env:
            - {name: JAVA_OPTS_KC_HEAP, value: {{ $.Values.development.keycloakJavaOptsHeap | default "-Xms128m -Xmx384m" | quote }}}
            - {name: JAVA_OPTS_APPEND, value: {{ $.Values.development.keycloakJavaOptsAppend | default "-XX:ActiveProcessorCount=2" | quote }}}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: {{ printf "jdbc:postgresql://%s-identity-db:5432/keycloak" (include "runloom.fullname" $) | quote }}}
            - {name: KC_DB_USERNAME, value: runloom}
            - {name: KC_DB_PASSWORD, value: runloom}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: development-only}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            - {name: KC_HOSTNAME, value: {{ printf "%s/auth" (trimSuffix "/" $.Values.auth.publicURL) | quote }}}
            - {name: RUNLOOM_PUBLIC_URL, value: {{ trimSuffix "/" $.Values.auth.publicURL | quote }}}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_HTTP_MANAGEMENT_RELATIVE_PATH, value: /}
            - {name: RUNLOOM_SMTP_HOST, value: {{ printf "%s-mailpit" (include "runloom.fullname" $) | quote }}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          startupProbe:
            httpGet: {path: /health/ready, port: management}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
          livenessProbe:
            httpGet: {path: /health/live, port: management}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
            - {name: login-theme, mountPath: /opt/keycloak/themes/runloom/login, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          {{- else }}
          image: {{ $.Values.development.mailpitImage | quote }}
          ports:
            - {name: http, containerPort: 8025}
            - {name: smtp, containerPort: 1025}
          readinessProbe:
            httpGet: {path: /livez, port: http}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          {{- end }}
      {{- if eq $component "keycloak" }}
      volumes:
        - name: realm
          configMap:
            name: {{ include "runloom.fullname" $ }}-realm
        - name: login-theme
          configMap:
            name: {{ include "runloom.fullname" $ }}-login-theme
            items:
              {{- range $path, $_ := $.Files.Glob "files/keycloak-theme/runloom/login/**" }}
              - key: {{ base $path }}
                path: {{ trimPrefix "files/keycloak-theme/runloom/login/" $path }}
              {{- end }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
