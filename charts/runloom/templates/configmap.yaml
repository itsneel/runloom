{{- if eq .Values.consumer.audience .Values.auth.clientID }}
{{- fail "consumer.audience must differ from auth.clientID" }}
{{- end }}
{{- if and (not .Values.development.enabled) (not .Values.consumer.provisioning.enabled) }}
{{- fail "Hosted Auth requires Keycloak directory provisioning credentials under consumer.provisioning" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runloom.fullname" . }}-config
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
data:
  api.yaml: |
    {{- include "runloom.deploymentConfig" (dict "root" . "component" "api") | nindent 4 }}
  worker.yaml: |
    {{- include "runloom.deploymentConfig" (dict "root" . "component" "worker") | nindent 4 }}
{{- if .Values.splitServices.enabled }}
  {{- range $component := list "auth" "workflows" "management" }}
  {{ $component }}.yaml: |
    {{- include "runloom.deploymentConfig" (dict "root" $ "component" $component) | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runloom.fullname" . }}-nginx
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location = /healthz { access_log off; return 200 "ok\n"; }
      location = /documentation.json { add_header Cache-Control "no-store"; }
      {{- if .Values.development.enabled }}
      location /auth/ {
        proxy_pass http://{{ include "runloom.fullname" . }}-keycloak:8080;
        # Keep Keycloak's upstream framing/CSP policy. Local header directives
        # prevent inheriting Studio's DENY, which blocks Keycloak's session iframes.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Canonical operator-configured origin; never trust caller-supplied forwarding headers.
        proxy_set_header Host {{ (urlParse .Values.auth.publicURL).host }};
        proxy_set_header X-Forwarded-Host {{ (urlParse .Values.auth.publicURL).host }};
        proxy_set_header X-Forwarded-Proto {{ (urlParse .Values.auth.publicURL).scheme }};
        proxy_set_header X-Forwarded-Port {{ include "runloom.publicPort" . }};
      }
      {{- end }}
      location /api/ {
        proxy_buffering off;
        proxy_pass http://{{ include "runloom.fullname" . }}-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host {{ (urlParse .Values.auth.publicURL).host }};
        proxy_set_header X-Forwarded-Host {{ (urlParse .Values.auth.publicURL).host }};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto {{ (urlParse .Values.auth.publicURL).scheme }};
        proxy_set_header X-Forwarded-Port {{ include "runloom.publicPort" . }};
      }
      location / { try_files $uri $uri/ /index.html; }
      location /remotes/workflows/ {
        proxy_pass http://{{ include "runloom.fullname" . }}-workflows-ui:8080/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
      }
      location /remotes/management/ {
        proxy_pass http://{{ include "runloom.fullname" . }}-management-ui:8080/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
      }
      location /remotes/ { return 404; }
      location /remotes/platform/ {
        proxy_pass http://{{ include "runloom.fullname" . }}-platform-ui:8080/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
      }
      location = /federation.manifest.json { add_header Cache-Control "no-cache"; }
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }
