{{- if .Values.serviceAccount.create }}
{{- range $component := list "api" "auth" "workflows" "management" "worker" "ui" "workflows-ui" "management-ui" "platform-ui" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "runloom.serviceAccount" (dict "root" $ "component" $component) }}
  labels:
    {{- include "runloom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
