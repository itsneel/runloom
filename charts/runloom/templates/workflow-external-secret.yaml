{{- $external := .Values.workflowSecrets.externalSecret | default dict }}
{{- if $external.enabled }}
{{- $name := include "runloom.workflowSecret" . }}
{{- $store := $external.secretStoreRef | default dict }}
{{- $remote := $external.remoteRef | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-workflow-key" (include "runloom.fullname" .) }}
  labels:
    {{- include "runloom.labels" . | nindent 4 }}
spec:
  # The vault key must not change without re-encrypting the database.
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ required "workflowSecrets.externalSecret.secretStoreRef.name is required" $store.name | quote }}
    kind: {{ default "ClusterSecretStore" $store.kind | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: true
  data:
    - secretKey: {{ .Values.workflowSecrets.secretKey | quote }}
      remoteRef:
        key: {{ required "workflowSecrets.externalSecret.remoteRef.key is required" $remote.key | quote }}
        {{- with $remote.property }}
        property: {{ . | quote }}
        {{- end }}
        decodingStrategy: {{ default "Base64" $remote.decodingStrategy | quote }}
{{- end }}
