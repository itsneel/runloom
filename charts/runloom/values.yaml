# Independent owner services. Local Make commands provision dependencies.
# Direct Helm/hosted installs supply database/Secret references; databaseSetup
# optionally creates owner databases before application deployment.
nameOverride: ""
assistant:
  enabled: true
  replicas: 1
  databaseName: runloom_assistant
  databaseSecret: runloom-assistant-database
  databaseURLKey: url
  # Only databaseSetup reads this key. The server receives only its owner URL.
  databasePasswordKey: password
  provider: disabled
  baseURL: ""
  model: ""
  allowHTTP: false
  maxTokens: 2048
  apiKeySecret: ""
  apiKeyKey: api-key
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  # With create=true, this is a prefix for eight per-workload accounts (empty uses fullname).
  # With create=false, use this existing account (empty means the namespace default).
  name: ""
  annotations: {}

service:
  annotations: {}
  # Only the Studio edge Service can be exposed externally; owner services stay internal.
  uiType: ClusterIP
  uiAnnotations: {}

autoscaling:
  defaults:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # Zero disables a resource metric. At least one metric must remain enabled.
    targetMemoryUtilizationPercentage: 0
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{type: Percent, value: 25, periodSeconds: 60}]
  workloads:
    api: {enabled: false}
    auth: {enabled: false}
    workflows: {enabled: false}
    management: {enabled: false}
    worker: {enabled: false}
    ui: {enabled: false}
    workflows-ui: {enabled: false}
    management-ui: {enabled: false}
    platform-ui: {enabled: false}

podDisruptionBudgets:
  workloads:
    api: {enabled: false, maxUnavailable: 1}
    auth: {enabled: false, maxUnavailable: 1}
    workflows: {enabled: false, maxUnavailable: 1}
    management: {enabled: false, maxUnavailable: 1}
    worker: {enabled: false, maxUnavailable: 1}
    ui: {enabled: false, maxUnavailable: 1}
    workflows-ui: {enabled: false, maxUnavailable: 1}
    management-ui: {enabled: false, maxUnavailable: 1}
    platform-ui: {enabled: false, maxUnavailable: 1}

# Applied per component, with a component-specific selector generated by the chart.
topologySpreadConstraints: []
# Example: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway}]

# Set by make k8s-up after local bootstrap; not an instruction for Helm to create secrets.
localSetup:
  managed: false

# Runs before servers are installed/upgraded. The database server and this
# bootstrap Secret must already exist; application pods never receive admin access.
databaseSetup:
  enabled: false
  existingSecret: ""

# Provision three owner-restricted databases first; see docs/service-split.md.
splitServices:
  enabled: true
  trustConfigMap: runloom-service-trust
  resources:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  # Optional per-service replica/resource overrides, merged over the defaults above.
  auth: {}
  workflows: {}
  management: {}
  databases:
    auth: {name: runloom_auth, existingSecret: runloom-auth-database, secretKey: url}
    workflows: {name: runloom_workflows, existingSecret: runloom-workflows-database, secretKey: url}
    management: {name: runloom_management, existingSecret: runloom-management-database, secretKey: url}
  credentials:
    auth: runloom-auth-token
    workflows: runloom-workflows-token
    management: runloom-management-token
    worker: runloom-worker-token
images:
  # Used only by explicitly local setup jobs, never by the Auth deployment.
  localAdmin:
    repository: runloom-local-admin
    tag: local
    pullPolicy: IfNotPresent
  assistant:
    repository: runloom-assistant
    tag: local
    pullPolicy: IfNotPresent
  database-setup:
    repository: runloom-database-setup
    tag: local
    pullPolicy: IfNotPresent
  auth:
    repository: runloom-auth
    tag: local
    pullPolicy: IfNotPresent
  management:
    repository: runloom-management
    tag: local
    pullPolicy: IfNotPresent
  gateway:
    repository: runloom-gateway
    tag: local
    pullPolicy: IfNotPresent
  workflows:
    repository: runloom-workflows
    tag: local
    pullPolicy: IfNotPresent
  worker:
    repository: runloom-worker
    tag: local
    pullPolicy: IfNotPresent
  ui:
    repository: runloom-ui
    tag: local
    pullPolicy: IfNotPresent
  workflows-ui:
    repository: runloom-workflows-ui
    tag: local
    pullPolicy: IfNotPresent
  management-ui:
    repository: runloom-management-ui
    tag: local
    pullPolicy: IfNotPresent
  platform-ui:
    repository: runloom-platform-ui
    tag: local
    pullPolicy: IfNotPresent

platformAccess:
  requiredACR: ""
  maxAuthAge: "15m"

api:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
worker:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
ui:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
workflows-ui:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
platform-ui:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
management-ui:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

temporal:
  # Required when development.enabled=false. Use TLS for hosted connections.
  address: ""
  namespace: default
  # Bootstrap client only; executions always use namespacePrefix + organization UUID.
  # Empty prefix defaults to the Helm release fullname. Keep it stable after setup.
  namespacePrefix: ""
  retentionDays: 30
  taskQueue: runloom
  tls:
    enabled: false
    serverName: ""
    existingSecret: ""
    caKey: ca.crt
    # Set both for certificate-based client authentication.
    certKey: ""
    keyKey: ""

database:
  driver: postgres
  # Connection URLs and database names belong to splitServices.databases above.
  # Application databases are externally provisioned, including in development.

llm:
  provider: openai-compatible
  # Optional ConfigMap containing a versioned pricing catalogue. No credentials.
  pricingConfigMap: ""
  pricingKey: pricing.json
  baseURL: https://api.openai.com/v1
  defaultModel: ""
  # Optional existing Secret; the API key is mounted only into the worker.
  existingSecret: ""
  secretKey: api-key

email:
  # Development mode uses the bundled Mailpit capture inbox when host is empty.
  enabled: true
  host: ""
  port: 587
  from: noreply@runloom.test
  tls: starttls
  username: ""
  existingSecret: ""
  secretKey: password
  allowedDomains: []

auth:
  # Optional signed Keycloak authentication-context and authentication freshness.
  requiredACR: ""
  maxAuthAge: ""
  # Exact browser origin, without trailing slash. Use HTTPS when hosted.
  publicURL: http://localhost:4200
  realm: runloom
  clientID: runloom
  googleEnabled: false
  # Hosted mode requires an external Keycloak base URL (including /auth if used).
  url: ""
  issuer: ""
  jwksURL: ""

executionSecurity:
  # Authoring access alone does not permit reading run payloads or schedules.
  sensitiveRunRoles: [admin]
  # Enable only for an explicit migration of old plaintext records/histories.
  allowLegacyPayloads: false
  # Optional mounted JSON keyring for execution-key rotation; otherwise a
  # domain-separated key is derived from the persistent workflow vault key.
  existingKeyringSecret: ""
  keyringSecretKey: keyring.json

workflowSecrets:
  # Development creates/reuses a retained encryption-key Secret when this is empty.
  # Hosted deployments must provision their own persistent 32-byte key.
  # The Secret must be in the release namespace; Workflows and worker mount it read-only.
  # Example: existingSecret: runloom-vault-key (never put the key value here).
  existingSecret: ""
  secretKey: encryption-key
  externalSecret:
    # Requires an installed External Secrets Operator serving external-secrets.io/v1.
    # Mutually exclusive with existingSecret. No cloud credentials belong here.
    enabled: false
    targetName: "" # Defaults to <chart-fullname>-workflow-key.
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    remoteRef:
      key: ""
      property: "" # Optional JSON property in the provider's secret.
      # Store a base64-encoded 32-byte key in the provider, decode once into the mount.
      decodingStrategy: Base64

consumer:
  audience: runloom-execution
  provisioning:
    # Hosted Auth requires this for organizations as well as service accounts.
    # Guarded local setup provisions it after the initial rollout.
    enabled: false
    # Keycloak base URL reachable from Auth, including /auth if applicable.
    adminURL: ""
    clientID: runloom-provisioner
    existingSecret: ""
    secretKey: client-secret

development:
  enabled: true
  temporalImage: temporalio/temporal:1.8.3
  postgresImage: postgres:17-alpine
  keycloakImage: quay.io/keycloak/keycloak:26.4.7
  # Leave room for native/JIT memory within the development container's 1Gi limit.
  keycloakJavaOptsHeap: "-Xms128m -Xmx384m"
  keycloakJavaOptsAppend: "-XX:ActiveProcessorCount=2"
  mailpitImage: axllent/mailpit:v1.27
  persistence:
    size: 5Gi
    # Empty uses the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

ingress:
  # Creates only the application Ingress, never a controller.
  # Optional controller: separate charts/runloom-ingress release.
  enabled: false
  className: ""
  annotations: {}
  host: studio.runloom.dev
  tls: []

nodeSelector: {}
observability:
  enabled: false
  collectorImage: otel/opentelemetry-collector-contrib:0.162.0
  collectorConfigMap: ""
  collectorResources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  prometheus:
    enabled: true
    image: prom/prometheus:v3.10.0
    retention: 7d
    storageSize: 5Gi
    storageClass: ""
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
tolerations: []
affinity: {}
# External Database nodes. Private/plaintext destinations need exact host:port
# approval. Never allow Runloom's own storage or control-plane databases.
databaseConnections:
  allowedAddresses: []
docs:
  enabled: true
  publicURL: http://localhost:4400
  replicas: 1
  image:
    repository: runloom-docs
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls: []
